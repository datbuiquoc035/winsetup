name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust backend
        shell: pwsh
        run: |
          cd src/winsetup-core
          rustc --version
          cargo --version
          rustup target list --installed
          echo "=== cargo check ==="
          cargo check --verbose 2>&1
          echo "=== cargo build ==="
          cargo build 2>&1

      - name: Build .NET frontend
        working-directory: src/Winsetup.App
        run: dotnet publish -c Release -o ../../publish

      - name: Copy Rust binary
        run: |
          copy src\winsetup-core\target\release\winsetup-core.exe publish\
          copy catalog.json publish\

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
