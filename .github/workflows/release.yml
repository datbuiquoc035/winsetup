name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust backend
        shell: pwsh
        run: |
          cd src/winsetup-core
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stage Rust binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item src/winsetup-core/target/release/winsetup-core.exe publish/
          Copy-Item catalog.json publish/

      - name: Build .NET frontend
        continue-on-error: true
        shell: pwsh
        run: |
          cd src/Winsetup.App
          dotnet publish -c Release -o ../../publish -p:WindowsPackageType=None

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
