name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust backend
        shell: pwsh
        run: |
          cd src/winsetup-core
          rustc --version
          cargo --version
          rustup target list --installed
          echo "=== cargo check ==="
          cargo check --verbose 2>&1
          echo "=== cargo build ==="
          cargo build 2>&1

      - name: Build .NET frontend
        shell: pwsh
        run: |
          dotnet --version
          dotnet workload install maui 2>&1
          cd src/Winsetup.App
          dotnet restore 2>&1
          dotnet build -c Release -p:Platform=x64 2>&1
          if ($LASTEXITCODE -eq 0) {
            Copy-Item -Recurse "bin\x64\Release\net8.0-windows10.0.19041.0\*" ..\..\publish\ -ErrorAction SilentlyContinue
          }

      - name: Copy Rust binary
        run: |
          copy src\winsetup-core\target\release\winsetup-core.exe publish\
          copy catalog.json publish\

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
