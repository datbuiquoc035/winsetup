name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust backend
        shell: pwsh
        run: |
          cd src/winsetup-core
          cargo build --release

      - name: Build .NET frontend
        shell: pwsh
        run: |
          cd src/Winsetup.App
          dotnet publish -c Release -o ../../publish --self-contained -r win-x64 -p:PublishSingleFile=true

      - name: Stage catalog
        shell: pwsh
        run: |
          Copy-Item catalog.json publish/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
